<script>
'use strict';
const K = { coins: 'ls_coins_v1' };
function lsGet(k, fb){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }catch(e){ return fb; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

let coins = lsGet(K.coins, ['BTC','ETH','SOL','BNB']);
let scanning = false, refreshTimer = null, openRow = null;
const cache = {};

// ══════════════════════════════════════
// TAGS (lista editable)
// ══════════════════════════════════════
function renderTags(){
  const c = document.getElementById('tags');
  c.innerHTML = '';
  coins.forEach(sym => {
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.innerHTML = sym + ' <span class="tag-x" data-sym="' + sym + '">✕</span>';
    c.appendChild(tag);
  });
  c.querySelectorAll('.tag-x').forEach(x => x.onclick = () => {
    coins = coins.filter(s => s !== x.dataset.sym);
    lsSet(K.coins, coins);
    renderTags();
  });
}
function addCoin(){
  const inp = document.getElementById('add-input');
  const val = inp.value.trim().toUpperCase().replace(/USDT$/,'');
  if(!val || coins.includes(val)){ inp.value=''; return; }
  coins.push(val);
  lsSet(K.coins, coins);
  inp.value = '';
  renderTags();
}

// ══════════════════════════════════════
// INDICADORES (mismas fórmulas que el Pine Script)
// ══════════════════════════════════════
function ema(vals, len){
  const k = 2/(len+1);
  let out = [vals[0]];
  for(let i=1;i<vals.length;i++) out.push(vals[i]*k + out[i-1]*(1-k));
  return out;
}
function sma(vals, len, i){ let s=0,c=0; for(let j=Math.max(0,i-len+1);j<=i;j++){ s+=vals[j]; c++; } return s/c; }
function highestN(vals, len, i){ let m=-Infinity; for(let j=Math.max(0,i-len+1);j<=i;j++) m=Math.max(m,vals[j]); return m; }
function lowestN(vals, len, i){ let m=Infinity; for(let j=Math.max(0,i-len+1);j<=i;j++) m=Math.min(m,vals[j]); return m; }
function linregLast(vals, len){
  // pendiente + intercept de regresión lineal sobre las últimas "len" muestras, evaluada en la última
  const n = Math.min(len, vals.length);
  const y = vals.slice(vals.length-n);
  const xs = y.map((_,i)=>i);
  const xm = xs.reduce((a,b)=>a+b,0)/n, ym = y.reduce((a,b)=>a+b,0)/n;
  let num=0,den=0;
  for(let i=0;i<n;i++){ num += (xs[i]-xm)*(y[i]-ym); den += (xs[i]-xm)**2; }
  const slope = den!==0 ? num/den : 0, intercept = ym - slope*xm;
  return slope*(n-1) + intercept;
}
function computeSQZseries(highs, lows, closes, len){
  const out = [];
  for(let i=0;i<closes.length;i++){
    if(i < len){ out.push(0); continue; }
    const hh = highestN(highs, len, i), ll = lowestN(lows, len, i);
    const smaC = sma(closes, len, i);
    const val = closes[i] - ((hh+ll)/2 + smaC)/2;
    const window = [];
    for(let j=Math.max(0,i-len+1);j<=i;j++){
      const hh2 = highestN(highs, len, j), ll2 = lowestN(lows, len, j), smaC2 = sma(closes, len, j);
      window.push(closes[j] - ((hh2+ll2)/2 + smaC2)/2);
    }
    out.push(linregLast(window, len));
  }
  return out;
}
function rsiSeries(closes, len){
  const out = [50];
  for(let i=1;i<closes.length;i++){
    if(i<len){ out.push(50); continue; }
    let g=0,l=0;
    for(let j=i-len+1;j<=i;j++){ const d=closes[j]-closes[j-1]; if(d>0) g+=d; else l+=Math.abs(d); }
    const ag=g/len, al=l/len;
    out.push(al===0 ? 100 : 100-(100/(1+ag/al)));
  }
  return out;
}
function stochasticClassic(closes, highs, lows, len, sk, sd){
  const raw = [];
  for(let i=0;i<closes.length;i++){
    if(i<len-1){ raw.push(50); continue; }
    const hh = highestN(highs, len, i), ll = lowestN(lows, len, i);
    raw.push(hh===ll ? 50 : (closes[i]-ll)/(hh-ll)*100);
  }
  const kArr = raw.map((_,i)=> sma(raw, sk, i));
  const dArr = kArr.map((_,i)=> sma(kArr, sd, i));
  return { k: kArr, d: dArr };
}
function atrSeries(highs, lows, closes, len){
  const tr = [highs[0]-lows[0]];
  for(let i=1;i<closes.length;i++) tr.push(Math.max(highs[i]-lows[i], Math.abs(highs[i]-closes[i-1]), Math.abs(lows[i]-closes[i-1])));
  const out = [];
  for(let i=0;i<tr.length;i++) out.push(sma(tr, len, i));
  return out;
}
// Pivots por CIERRE (no mecha) — igual que "ver en modo línea"
function pivotsByClose(closes, lr){
  const highs=[], lows=[];
  for(let i=lr;i<closes.length-lr;i++){
    let isHigh=true, isLow=true;
    for(let j=i-lr;j<=i+lr;j++){ if(j===i) continue; if(closes[j]>=closes[i]) isHigh=false; if(closes[j]<=closes[i]) isLow=false; }
    if(isHigh) highs.push({idx:i, val:closes[i]});
    if(isLow) lows.push({idx:i, val:closes[i]});
  }
  return { highs, lows };
}

// ══════════════════════════════════════
// FETCH BINANCE
// ══════════════════════════════════════
async function fetchKlines(symbol, interval, limit){
  const r = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}USDT&interval=${interval}&limit=${limit}`);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
async function fetchDepth(symbol){
  const r = await fetch(`https://fapi.binance.com/fapi/v1/depth?symbol=${symbol}USDT&limit=500`);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

// ══════════════════════════════════════
// FUERZA DISPONIBLE — libro de órdenes vs. velocidad de compra/venta.
// Camina el libro desde el precio actual hacia el objetivo, acumulando
// liquidez en USD, hasta que se iguala a la "velocidad" reciente (CVD de
// las últimas velas en USD). Ese punto es el alcance ESTIMADO real —
// no es una garantía, es "con esta fuerza, hasta acá llegaría".
// ══════════════════════════════════════
function calcFuerzaDisponible(depth, price, direction, target, closes, opens, vols){
  if(!depth || (!depth.asks && !depth.bids)) return { estimado: null, alcanza: null, texto: '—' };
  const n = Math.min(6, closes.length);
  let veloc = 0;
  for(let i=closes.length-n;i<closes.length;i++){
    veloc += (closes[i] >= opens[i] ? 1 : -1) * vols[i];
  }
  veloc = Math.abs(veloc) * price; // en USD aprox

  const book = direction === 'long'
    ? depth.asks.map(a=>({p:+a[0], q:+a[1]})).filter(a=>a.p>price && a.p<=target*1.05).sort((a,b)=>a.p-b.p)
    : depth.bids.map(b=>({p:+b[0], q:+b[1]})).filter(b=>b.p<price && b.p>=target*0.95).sort((a,b)=>b.p-a.p);

  if(!book.length || veloc <= 0) return { estimado: null, alcanza: null, texto: 'Sin datos suficientes' };

  let acumulado = 0, estimado = book[book.length-1].p;
  for(const lvl of book){
    acumulado += lvl.p * lvl.q;
    if(acumulado >= veloc){ estimado = lvl.p; break; }
  }
  const alcanza = direction === 'long' ? estimado >= target : estimado <= target;
  const texto = alcanza
    ? '✓ Alcanzaría el pico (' + fmtP(estimado) + ')'
    : 'Solo hasta ~' + fmtP(estimado) + ' (no llega al pico)';
  return { estimado, alcanza, texto };
}

// ══════════════════════════════════════
// ANÁLISIS COMPLETO POR MONEDA (misma lógica que el Pine, timeframe base 4H)
// ══════════════════════════════════════
async function analizarMoneda(symbol){
  try{
    const [k4h, kD, depth] = await Promise.all([
      fetchKlines(symbol, '4h', 120),
      fetchKlines(symbol, '1d', 120),
      fetchDepth(symbol).catch(()=>null)
    ]);
    if(!Array.isArray(k4h) || k4h.length < 60) return { symbol, error: 'Sin datos' };

    const closes = k4h.map(k=>+k[4]), highs = k4h.map(k=>+k[2]), lows = k4h.map(k=>+k[3]);
    const price = closes[closes.length-1];
    const change = (price - closes[closes.length-2]) / closes[closes.length-2] * 100;

    const emaArr = ema(closes, 50);
    const emaVal = emaArr[emaArr.length-1];
    const trendUp = price > emaVal, trendDown = price < emaVal;

    const sqzArr = computeSQZseries(highs, lows, closes, 20);
    const sqzNow = sqzArr[sqzArr.length-1], sqzPrev = sqzArr[sqzArr.length-2];
    const sqzBull = sqzNow > 0, sqzBear = sqzNow <= 0;
    const rojoOscuro = sqzBear && sqzNow >= sqzPrev;   // agotándose
    const rojoBrillante = sqzBear && sqzNow < sqzPrev;
    const verdeOscuro = sqzBull && sqzNow <= sqzPrev;
    const verdeBrillante = sqzBull && sqzNow > sqzPrev;

    const sto = stochasticClassic(closes, highs, lows, 14, 3, 3);
    const stoK = sto.k[sto.k.length-1];
    const sobrecompra = stoK >= 80, sobreventa = stoK <= 20;

    const atrArr = atrSeries(highs, lows, closes, 14);
    const atrNow = atrArr[atrArr.length-1];

    // Picos importantes: pivots por cierre en Diario, con filtro de significancia (1.5 ATR diario)
    // Solo cuentan como resistencia/soporte VIGENTE si todavía están por encima/debajo del precio
    // actual — un pico ya superado por un pump/caída no es una resistencia/soporte real.
    const dCloses = kD.map(k=>+k[4]), dHighs = kD.map(k=>+k[2]), dLows = kD.map(k=>+k[3]);
    const atrD = atrSeries(dHighs, dLows, dCloses, 14);
    const atrDNow = atrD[atrD.length-1];
    const piv = pivotsByClose(dCloses, 4);
    let picoRes = null, picoSup = null;
    for(let i=piv.highs.length-1;i>=0;i--){
      const v = piv.highs[i].val;
      if(v <= price) continue; // ya superado, no sirve como resistencia vigente
      if(picoRes===null || Math.abs(v - picoRes) >= atrDNow*1.5){ picoRes = v; break; }
    }
    for(let i=piv.lows.length-1;i>=0;i--){
      const v = piv.lows[i].val;
      if(v >= price) continue; // ya perforado, no sirve como soporte vigente
      if(picoSup===null || Math.abs(picoSup - v) >= atrDNow*1.5){ picoSup = v; break; }
    }

    const nivelSup = picoSup !== null ? picoSup : lowestN(lows, 40, lows.length-1);
    const nivelRes = picoRes !== null ? picoRes : highestN(highs, 40, highs.length-1);

    // Manipulación: barrido en las últimas 6 velas de 4H
    let barridoLong = false, barridoShort = false;
    for(let i=closes.length-6;i<closes.length;i++){
      if(i<1) continue;
      if(nivelSup!==null && lows[i] < nivelSup && closes[i] > nivelSup) barridoLong = true;
      if(nivelRes!==null && highs[i] > nivelRes && closes[i] < nivelRes) barridoShort = true;
    }

    // Fuerza disponible: para LONG mide si la compra puede llegar al pico de arriba (nivelRes);
    // para SHORT, si la venta puede llegar al pico de abajo (nivelSup).
    const opens4h = k4h.map(k=>+k[1]);
    const vols4h  = k4h.map(k=>+k[5]);
    const fuerzaLong  = calcFuerzaDisponible(depth, price, 'long',  nivelRes, closes, opens4h, vols4h);
    const fuerzaShort = calcFuerzaDisponible(depth, price, 'short', nivelSup, closes, opens4h, vols4h);

    // Imbalance (FVG) simple: último hueco de 3 velas sin rellenar, % con mecha
    let fvgTxt = '—', fvgBull = false, fvgBear = false;
    for(let i=closes.length-1;i>=2;i--){
      if(lows[i] > highs[i-2]){ // bull FVG
        const top=lows[i], bot=highs[i-2];
        let minTocado = top;
        for(let j=i;j<closes.length;j++) minTocado = Math.min(minTocado, lows[j]);
        const pct = Math.min(100, Math.max(0, (top-minTocado)/(top-bot)*100));
        if(pct < 100){ fvgTxt = Math.round(pct)+'% relleno ▲'; fvgBull = pct < 100; }
        break;
      }
      if(highs[i-2] > lows[i-2] && highs[i-2] < lows[i]) continue;
      if(highs[i] < lows[i-2]){ // bear FVG
        const top=lows[i-2], bot=highs[i];
        let maxTocado = bot;
        for(let j=i;j<closes.length;j++) maxTocado = Math.max(maxTocado, highs[j]);
        const pct = Math.min(100, Math.max(0, (maxTocado-bot)/(top-bot)*100));
        if(pct < 100){ fvgTxt = Math.round(pct)+'% relleno ▼'; fvgBear = pct < 100; }
        break;
      }
    }

    const validaSqzLong = rojoOscuro;
    const validaSqzShort = verdeOscuro;
    const senalLong = trendUp && barridoLong && validaSqzLong;
    const senalShort = trendDown && barridoShort && validaSqzShort;

    let scoreL = 0;
    scoreL += trendUp?1:0; scoreL += barridoLong?1:0; scoreL += rojoOscuro?1:0;
    scoreL += sobreventa?1:0; scoreL += fvgBull?1:0;

    let scoreS = 0;
    scoreS += trendDown?1:0; scoreS += barridoShort?1:0; scoreS += verdeOscuro?1:0;
    scoreS += sobrecompra?1:0; scoreS += fvgBear?1:0;

    return {
      symbol, price, change, trendUp, trendDown,
      sqzTxt: rojoOscuro ? 'Valle rojo oscuro (agotándose)' : rojoBrillante ? 'Valle rojo claro' : verdeBrillante ? 'Montaña verde ▲' : 'Montaña verde (débil)',
      sqzGood: rojoOscuro || verdeOscuro,
      stoK, sobrecompra, sobreventa,
      barridoLong, barridoShort,
      fvgTxt,
      scoreL, scoreS,
      senalLong, senalShort,
      picoRes, picoSup, nivelSup, nivelRes, atrNow,
      fuerzaLong, fuerzaShort
    };
  }catch(e){ return { symbol, error: e.message }; }
}

// ══════════════════════════════════════
// RENDER
// ══════════════════════════════════════
function fmtP(p){ if(p===null||p===undefined||isNaN(p)) return '—'; if(p>=1) return p.toFixed(4); if(p>=0.01) return p.toFixed(5); return p.toFixed(6); }

function renderRow(d){
  if(d.error) return `<tr><td class="sym">${d.symbol}</td><td colspan="9" style="color:var(--text3)">${d.error}</td></tr>`;
  const trendBadge = d.trendUp ? '<span class="badge b-green">▲ ALCISTA</span>' : '<span class="badge b-red">▼ BAJISTA</span>';
  const stoTxt = d.sobrecompra ? 'SOBRECOMPRA' : d.sobreventa ? 'SOBREVENTA' : 'NEUTRA';
  const stoBadge = `<span class="badge ${d.sobreventa?'b-green':d.sobrecompra?'b-red':'b-gray'}">${Math.round(d.stoK)} · ${stoTxt}</span>`;
  const manipTxt = (d.barridoLong?'✓L ':'') + (d.barridoShort?'✓S':'') || 'esperando';
  const senalBadge = d.senalLong ? '<span class="badge b-green">🎣 LONG</span>' : d.senalShort ? '<span class="badge b-red">🎣 SHORT</span>' : '<span class="badge b-gray">—</span>';
  const rowClass = d.senalLong ? 'signal-long' : d.senalShort ? 'signal-short' : '';
  return `<tr class="${rowClass}" data-sym="${d.symbol}">
    <td class="sym">${d.symbol}</td>
    <td class="r">${fmtP(d.price)}</td>
    <td>${trendBadge}</td>
    <td style="color:${d.sqzGood?'var(--green)':'var(--text2)'}">${d.sqzTxt}</td>
    <td>${stoBadge}</td>
    <td>${manipTxt}</td>
    <td>${d.fvgTxt}</td>
    <td class="r ${d.scoreL>=3?'score-hi':'score-lo'}">${d.scoreL}/5</td>
    <td class="r ${d.scoreS>=3?'score-hi':'score-lo'}">${d.scoreS}/5</td>
    <td>${senalBadge}</td>
  </tr>
  <tr class="detail" id="detail-${d.symbol}"><td colspan="10"><div class="detail-inner">
    <div class="dcard"><div class="dcard-label">Pico resistencia (Diario)</div><div class="dcard-val">${d.picoRes?fmtP(d.picoRes):'—'}</div></div>
    <div class="dcard"><div class="dcard-label">Pico soporte (Diario)</div><div class="dcard-val">${d.picoSup?fmtP(d.picoSup):'—'}</div></div>
    <div class="dcard"><div class="dcard-label">Nivel objetivo LONG (soporte)</div><div class="dcard-val">${fmtP(d.nivelSup)}</div></div>
    <div class="dcard"><div class="dcard-label">Nivel objetivo SHORT (resistencia)</div><div class="dcard-val">${fmtP(d.nivelRes)}</div></div>
    <div class="dcard"><div class="dcard-label">ATR (4H)</div><div class="dcard-val">${fmtP(d.atrNow)}</div></div>
    <div class="dcard"><div class="dcard-label">Cambio 4H</div><div class="dcard-val" style="color:${d.change>=0?'var(--green)':'var(--red)'}">${d.change>=0?'+':''}${d.change.toFixed(2)}%</div></div>
    <div class="dcard"><div class="dcard-label">Fuerza disponible (LONG → pico arriba)</div><div class="dcard-val" style="font-size:12px;color:${d.fuerzaLong.alcanza?'var(--green)':'var(--text2)'}">${d.fuerzaLong.texto}</div></div>
    <div class="dcard"><div class="dcard-label">Fuerza disponible (SHORT → pico abajo)</div><div class="dcard-val" style="font-size:12px;color:${d.fuerzaShort.alcanza?'var(--red)':'var(--text2)'}">${d.fuerzaShort.texto}</div></div>
  </div></td></tr>`;
}

async function runScan(){
  if(scanning) return;
  if(!coins.length){ return; }
  scanning = true;
  const btn = document.getElementById('scan-btn');
  btn.disabled = true; btn.textContent = '⟳ ESCANEANDO...';
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = `<tr><td colspan="10" style="padding:40px;text-align:center;color:var(--text2)"><span class="spinner"></span>Analizando ${coins.length} moneda(s)...</td></tr>`;
  const results = await Promise.all(coins.map(analizarMoneda));
  tbody.innerHTML = results.map(renderRow).join('');
  tbody.querySelectorAll('tr[data-sym]').forEach(row => {
    row.onclick = () => {
      const sym = row.dataset.sym;
      const det = document.getElementById('detail-'+sym);
      const wasOpen = det.classList.contains('open');
      tbody.querySelectorAll('.detail').forEach(d => d.classList.remove('open'));
      if(!wasOpen) det.classList.add('open');
    };
  });
  document.getElementById('last-update').textContent = 'Última actualización: ' + new Date().toLocaleTimeString('es-AR');
  document.getElementById('ts').textContent = new Date().toLocaleTimeString('es-AR');
  btn.disabled = false; btn.textContent = '▶ ESCANEAR';
  scanning = false;
}

function setRefresh(){
  const v = parseInt(document.getElementById('refresh-select').value);
  clearInterval(refreshTimer); refreshTimer = null;
  if(v > 0) refreshTimer = setInterval(runScan, v*1000);
}

renderTags();
document.getElementById('add-btn').addEventListener('click', addCoin);
document.getElementById('add-input').addEventListener('keydown', e => { if(e.key==='Enter') addCoin(); });
document.getElementById('scan-btn').addEventListener('click', runScan);
document.getElementById('refresh-select').addEventListener('change', setRefresh);
setTimeout(() => { runScan(); setRefresh(); }, 300);
</script>
</body>
</html>
