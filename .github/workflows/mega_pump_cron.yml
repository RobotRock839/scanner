name: MEGA_PUMP scan (sin navegador)

on:
  schedule:
    # Cada 5 minutos (mínimo permitido por GitHub Actions).
    - cron: '*/5 * * * *'
  workflow_dispatch: {}  # permite tocar "Run workflow" manualmente para probar

# Necesario para que la Action pueda commitear el historial actualizado
permissions:
  contents: write

concurrency:
  group: mega-pump-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scan
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HIST_PATH: mega_pump_historial.json
        run: node mega_pump_scan.mjs

      - name: Commit historial actualizado
        run: |
          git config user.name "mega-pump-bot"
          git config user.email "actions@github.com"
          git add mega_pump_historial.json
          git diff --staged --quiet || git commit -m "chore: actualizar historial mega pump [skip ci]"
          git push
