<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPIKE_SCANNER · Techo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root{
        --bg-void:#05060a;
        --bg-panel:#0b0d14;
        --bg-panel-2:#10121b;
        --line:#1b1e2b;
        --line-soft:#141620;
        --text:#e2e4f1;
        --text-dim:#565c74;
        --text-faint:#31344a;
        --danger:#ff3b5c;
        --danger-glow:rgba(255,59,92,.45);
        --safe:#00e0a4;
        --gold:#f2b705;
        --blue-neon:#00d4ff;
        --blue-neon-glow:rgba(0,212,255,.5);
    }
    *{box-sizing:border-box;}
    body{
        background:
            radial-gradient(circle at 15% 0%, rgba(255,59,92,.06), transparent 40%),
            radial-gradient(circle at 85% 100%, rgba(0,224,164,.05), transparent 40%),
            var(--bg-void);
        color:var(--text);
        font-family:'JetBrains Mono', monospace;
        min-height:100vh;
        margin:0;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:32px 16px;
    }
    .terminal{
        width:100%;
        max-width:460px;
        background:var(--bg-panel);
        border:1px solid var(--line);
        border-radius:10px;
        overflow:hidden;
        box-shadow:0 30px 60px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02) inset;
        transition: background 1s ease;
    }

    .terminal.zona-peligro{
        background:
            radial-gradient(circle at 15% 0%, rgba(255,59,92,.10), transparent 45%),
            radial-gradient(circle at 85% 100%, rgba(255,59,92,.10), transparent 45%),
            rgba(255,59,92,.16);
    }
    .terminal.modo-vertical{
        animation: panelPulse 1.05s ease-in-out infinite;
    }
    @keyframes panelPulse{
        0%,100%{ box-shadow:0 30px 60px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02) inset, 0 0 0 0 var(--danger-glow); }
        50%{ box-shadow:0 30px 60px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02) inset, 0 0 46px 8px var(--danger-glow); }
    }

    .term-bar{
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:11px 16px;
        background:var(--bg-panel-2);
        border-bottom:1px solid var(--line);
    }
    .dots{display:flex;gap:6px;}
    .dots span{width:9px;height:9px;border-radius:50%;background:var(--text-faint);}
    .term-title{
        font-size:12px;
        font-weight:700;
        letter-spacing:.12em;
        color:var(--text-dim);
    }
    .term-title b{color:var(--text);}
    .status{
        display:flex;
        align-items:center;
        gap:6px;
        font-size:10px;
        font-weight:600;
        letter-spacing:.14em;
        color:var(--text-faint);
    }
    .status-dot{
        width:6px;height:6px;border-radius:50%;
        background:var(--text-faint);
    }
    .status-dot.on{background:var(--safe);box-shadow:0 0 8px var(--safe);}

    .term-body{padding:20px;}

    .input-row{
        display:flex;
        gap:8px;
        margin-bottom:10px;
    }
    .input-wrap{
        flex:1;
        display:flex;
        align-items:center;
        gap:8px;
        background:var(--bg-void);
        border:1px solid var(--line);
        border-radius:7px;
        padding:0 12px;
    }
    .input-wrap span{color:var(--gold);font-weight:700;}
    #sym{
        flex:1;
        background:transparent;
        border:none;
        outline:none;
        color:var(--text);
        font-family:inherit;
        font-size:14px;
        font-weight:600;
        letter-spacing:.05em;
        padding:11px 0;
    }
    #sym::placeholder{color:var(--text-faint);}
    #btn{
        padding:0 18px;
        background:var(--text);
        color:var(--bg-void);
        border:none;
        border-radius:7px;
        font-family:inherit;
        font-size:12px;
        font-weight:800;
        letter-spacing:.1em;
        cursor:pointer;
        transition:transform .12s, background .12s;
    }
    #btn:hover{background:var(--gold);}
    #btn:active{transform:scale(.96);}

    #out{min-height:2px;}
    .empty-hint{
        font-size:11px;
        color:var(--text-faint);
        padding:6px 2px 2px;
        letter-spacing:.03em;
    }
    .err{
        margin-top:14px;
        padding:12px 14px;
        border:1px solid rgba(255,59,92,.3);
        background:rgba(255,59,92,.06);
        color:var(--danger);
        font-size:12px;
        border-radius:7px;
        letter-spacing:.02em;
    }

    .divider{
        height:1px;
        background:var(--line);
        margin:20px 0;
    }

    /* ===== PANEL DE VEREDICTO (lectura en lenguaje simple) ===== */
    .veredicto-box{
        border:1px solid var(--line);
        border-radius:9px;
        padding:14px 15px;
        background:var(--bg-panel-2);
    }
    .veredicto-eyebrow{
        font-size:9.5px;
        font-weight:700;
        letter-spacing:.16em;
        color:var(--text-dim);
        margin-bottom:8px;
    }
    .veredicto-headline{
        font-size:17px;
        font-weight:800;
        letter-spacing:-.01em;
        line-height:1.3;
        margin-bottom:6px;
    }
    .veredicto-sub{
        font-size:11px;
        color:var(--text-dim);
        line-height:1.6;
        letter-spacing:.01em;
    }
    .veredicto-chips{
        display:flex;
        flex-wrap:wrap;
        gap:6px;
        margin-top:12px;
    }
    .chip{
        font-size:9.5px;
        font-weight:700;
        letter-spacing:.04em;
        padding:5px 9px;
        border-radius:6px;
        border:1px solid var(--line);
        background:var(--bg-void);
        white-space:nowrap;
    }
    .confianza-track{
        margin-top:12px;
        height:6px;
        border-radius:3px;
        background:var(--line-soft);
        overflow:hidden;
    }
    .confianza-fill{
        height:100%;
        border-radius:3px;

    }
    .confianza-label{
        display:flex;
        justify-content:space-between;
        font-size:8.5px;
        color:var(--text-faint);
        margin-top:5px;
        letter-spacing:.06em;
    }

    .label-row{
        display:flex;
        justify-content:space-between;
        align-items:baseline;
        margin-bottom:4px;
    }
    .eyebrow{
        font-size:10px;
        font-weight:700;
        letter-spacing:.16em;
        color:var(--text-dim);
    }
    .pair-tag{
        font-size:10px;
        font-weight:600;
        color:var(--text-faint);
        letter-spacing:.08em;
    }
    .price-value{
        font-size:36px;
        font-weight:800;
        color:var(--danger);
        text-shadow:0 0 18px var(--danger-glow);
        letter-spacing:-.01em;
        line-height:1.1;
        margin-top:2px;
    }

    .chart-wrap{
        position:relative;
        margin:22px 0 6px;
        padding-top:22px;
    }
    .wall-tag{
        position:absolute;
        top:0;
        transform:translateX(-50%);
        font-size:9px;
        font-weight:700;
        letter-spacing:.1em;
        color:var(--danger);
        white-space:nowrap;
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:2px;
    }
    .wall-tag::after{
        content:'';
        width:1px;
        height:6px;
        background:var(--danger);
    }
    .gridlines{
        position:absolute;
        inset:22px 0 26px 0;
        display:flex;
        flex-direction:column;
        justify-content:space-between;
        pointer-events:none;
    }
    .gridlines div{
        height:1px;
        background:var(--line-soft);
    }
    .wallbar{
        position:relative;
        height:76px;
        display:flex;
        align-items:flex-end;
        gap:3px;
    }
    .wcol{
        flex:1;
        background:var(--text-faint);
        opacity:.4;
        border-radius:2px 2px 0 0;
        min-height:2px;
        transition:height .4s cubic-bezier(.2,.8,.2,1);

    .wcol.top{
        background:var(--danger);
        opacity:1;
        box-shadow:0 0 14px var(--danger-glow);
        animation:pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse{
        0%,100%{opacity:1;}
        50%{opacity:.55;}
    }
    .axis{
        display:flex;
        justify-content:space-between;
        margin-top:8px;
        font-size:9px;
        color:var(--text-faint);
        letter-spacing:.03em;

    .lightning-icon{
        position:absolute;
        top:-4px;
        right:0;

        opacity:0;
        transform:scale(.5);
        transition:opacity .3s, transform .3s;
        filter:drop-shadow(0 0 8px var(--blue-neon-glow));

    }
    .lightning-icon.show{
        opacity:1;
        transform:scale(1);
        animation:flicker 1.3s ease-in-out infinite;
    }
    @keyframes flicker{
        0%,100%{opacity:1;}
        50%{opacity:.5;}

    .metric-row{margin-top:22px;}
    .metric-head{
        display:flex;
        justify-content:space-between;
        align-items:baseline;
        margin-bottom:8px;
    }
    .metric-label-wrap{
        position:relative;
        display:flex;
        align-items:center;
        gap:6px;
    }
    .metric-label{
        font-size:10px;
        font-weight:700;
        letter-spacing:.14em;
        color:var(--text-dim);
    }
    .info-icon{
        width:14px;
        height:14px;
        border-radius:50%;
        border:1px solid var(--text-faint);
        color:var(--text-faint);
        font-size:9px;
        font-weight:700;
        line-height:12px;
        text-align:center;
        cursor:pointer;
        user-select:none;
        flex-shrink:0;
        transition:border-color .15s, color .15s;
    }
    .info-icon:hover, .info-icon.active{
        border-color:var(--gold);
        color:var(--gold);
    }
    .tooltip{
        position:absolute;
        left:0;
        bottom:calc(100% + 10px);
        width:270px;
        max-width:calc(100vw - 80px);
        background:var(--bg-panel-2);
        border:1px solid var(--line);
        border-radius:8px;
        padding:12px 13px;
        font-size:10.5px;
        line-height:1.55;
        color:var(--text-dim);
        letter-spacing:.01em;
        box-shadow:0 12px 30px -8px rgba(0,0,0,.6);
        opacity:0;
        visibility:hidden;
        transform:translateY(4px);
        transition:opacity .15s, transform .15s, visibility .15s;
        z-index:10;
    }
    .tooltip b{color:var(--text);font-weight:700;}
    .tooltip::after{
        content:'';
        position:absolute;
        top:100%;
        left:9px;
        border:5px solid transparent;
        border-top-color:var(--line);
    }
    .info-icon.active + .tooltip,
    .metric-label-wrap:hover .tooltip{
        opacity:1;
        visibility:visible;
        transform:translateY(0);
    }
    .metric-value{
        font-size:15px;
        font-weight:700;
        display:flex;
        align-items:center;
        gap:6px;
    }
    .gauge{
        display:flex;
        gap:3px;
        height:8px;
    }
    .gauge div{
        flex:1;
        border-radius:2px;
        background:var(--line-soft);
        transition:background .3s;
    }

    .energy-bar-wrap{
        height:8px;
        border-radius:4px;
        background:var(--line-soft);
        overflow:hidden;
    }
    .energy-bar-fill{
        height:100%;
        width:0%;
        border-radius:4px;
        background:var(--text-faint);
        transition:width .4s ease, background .4s ease, box-shadow .4s ease;
    }
    .energy-bar-fill.carga{
        background:var(--blue-neon);
        box-shadow:0 0 12px var(--blue-neon-glow);
    }
    .energy-bar-fill.debilidad{
        background:var(--gold);
        box-shadow:0 0 10px rgba(242,183,5,.45);
    }
    .energy-bar-fill.ruptura{
        background:var(--danger);
        box-shadow:0 0 14px var(--danger-glow);
        animation:pulse 1s ease-in-out infinite;
    }

    .mcap-sub{
        font-size:9px;
        color:var(--text-faint);
        margin-top:6px;
        letter-spacing:.02em;
        line-height:1.5;
    }

    .energy-bar-fill.consumo-real{
        background:#ff9900;
        box-shadow:0 0 14px rgba(255,153,0,.55);
        animation:pulse 1s ease-in-out infinite;
    }
    .energy-bar-fill.retiro{
        background:var(--text-dim);
    }
    .energy-bar-fill.reforzando{
        background:var(--safe);
        box-shadow:0 0 10px rgba(0,224,164,.4);
    }
    .energy-bar-fill.estable{
        background:var(--text-faint);
    }
    .energy-bar-fill.cvd-buy{
        background:var(--safe);
        box-shadow:0 0 10px rgba(0,224,164,.4);
    }
    .energy-bar-fill.cvd-sell{
        background:var(--danger);
        box-shadow:0 0 10px var(--danger-glow);
    }
    .terminal.tension-critica{
        animation: tensionBlink .9s ease-in-out infinite;
    }
    @keyframes tensionBlink{
        0%,100%{ box-shadow:0 30px 60px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02) inset, 0 0 0 0 rgba(255,153,0,0); }
        50%{ box-shadow:0 30px 60px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02) inset, 0 0 46px 10px rgba(255,153,0,.6); }
    }
    #tensionValue.critica{
        color:#ff9900 !important;
        animation:flicker .9s ease-in-out infinite;
    }

    .squeeze-gauge-wrap{
        display:flex;
        align-items:center;
        gap:10px;
    }
    .squeeze-gauge-track{
        position:relative;
        flex:1;
        height:8px;
        border-radius:4px;
        background:var(--line-soft);
        overflow:hidden;
    }
    .squeeze-gauge-fill{
        height:100%;
        border-radius:4px;
        transition:width .5s ease, background .5s ease, box-shadow .5s ease;
    }
    .squeeze-badge{
        font-size:9px;
        font-weight:800;
        letter-spacing:.08em;
        padding:3px 7px;
        border-radius:5px;
        white-space:nowrap;
    }
    .squeeze-sub-grid{
        display:grid;
        grid-template-columns:1fr 1fr 1fr;
        gap:8px;
        margin-top:12px;
    }
    .squeeze-stat{
        background:var(--bg-void);
        border:1px solid var(--line);
        border-radius:7px;
        padding:8px 9px;
    }
    .squeeze-stat-label{
        font-size:8.5px;
        font-weight:700;
        letter-spacing:.08em;
        color:var(--text-faint);
        margin-bottom:4px;
    }
    .squeeze-stat-value{
        font-size:12px;
        font-weight:700;
    }
    .squeeze-fuel-tag{
        margin-top:10px;
        display:inline-block;
        font-size:9.5px;
        font-weight:700;
        letter-spacing:.03em;
        padding:5px 9px;
        border-radius:6px;
        border:1px solid var(--line);
        background:var(--bg-void);
    }

        font-size:8.5px;
        color:var(--text-faint);
        margin-top:8px;
        line-height:1.5;

<body>
<div class="terminal">
    <div class="term-bar">
        <div class="dots"><span></span><span></span><span></span></div>
        <div class="term-title"><b>SPIKE</b>_SCANNER</div>
        <div class="status"><span class="status-dot" id="statusDot"></span><span id="statusText">IDLE</span></div>
    </div>
    <div class="term-body">
        <div class="input-row">
            <div class="input-wrap">
                <span>#</span>
                <input id="sym" placeholder="TOKEN — ej. BANK" autocomplete="off">
            </div>
            <button id="btn">RUN →</button>
        </div>
        <div class="empty-hint">Analiza el libro de órdenes de Binance Futures, el Market Cap real, la energía de choque ballena vs. pared, y sondea cada 5s el consumo real de la pared (CVD + tensión de proximidad).</div>
        <div id="out"></div>
    </div>
</div>

<script>
let prevRes = 0;
let wallWatch = null;               // { priceLow, priceHigh, lastUsd, lastTradeTime } — pared vigilada por el módulo Pre-Ruptura
let pollTimer = null;               // intervalo de sondeo Pre-Ruptura
let squeezeTimer = null;            // intervalo de refresco del módulo Riesgo de Squeeze
const SQUEEZE_POLL_MS = 15000;      // funding/OI/long-short no cambian tan rápido como el order book
const POLL_MS = 5000;               // frecuencia de sondeo (ms)
const TENSION_THRESHOLD_PCT = 0.1;  // % de distancia precio↔pared que dispara la alerta de tensión
const RNG_PCT = 0.15;
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');

/* ============================================================
   CONFIGURACIÓN — MÓDULO 1: REALIDAD FUNDAMENTAL (MARKET CAP)
   ============================================================ */
const CONFIG_UMBRALES = {
    BTC: 3_000_000_000_000,
    ETH: 1_000_000_000_000,
    SOL: 500_000_000_000,
    BNB: 300_000_000_000,
};
const UMBRAL_FALLBACK_MULTIPLIER = 3;
const CACHE_TTL_MS = 60 * 60 * 1000;
const UMBRAL_PENDIENTE_CRITICO_PCT = 0.15;

/* ============================================================
   ESTADO GLOBAL DEL VEREDICTO
   ============================================================
   Cada módulo (Energía, Consumo de Pared, CVD, Squeeze) escribe
   su lectura acá. Tras cada actualización se llama a
   renderVeredicto() para recalcular el resumen en lenguaje simple.
*/
let lecturas = {
    energia: null,   // 'carga' | 'debilidad' | 'ruptura' | 'neutro'
    consumo: null,   // 'consumo-real' | 'retiro' | 'reforzando' | 'estable'
    cvd: null,       // 'compra' | 'venta' | 'sin-datos'
    squeezeFuel: null, // 'quemandose' | 'fresco' | 'shorts-nuevos' | 'deleverage' | null
    squeezeScore: null // 0-100
};

function fmtPrice(p){
    if(p >= 100) return p.toFixed(2);
    if(p >= 1) return p.toFixed(4);
    return p.toPrecision(4);
}

function formatCompact(n){
    if(n === null || n === undefined || isNaN(n)) return '—';
    const abs = Math.abs(n);
    if(abs >= 1e12) return (n/1e12).toFixed(2)+'T';
    if(abs >= 1e9) return (n/1e9).toFixed(2)+'B';
    if(abs >= 1e6) return (n/1e6).toFixed(2)+'M';
    if(abs >= 1e3) return (n/1e3).toFixed(2)+'K';
    return n.toFixed(2);
}

function getCachedTokenData(symbol){
    try{
        const raw = localStorage.getItem(`cg_cache_${symbol}`);
        if(!raw) return null;
        const data = JSON.parse(raw);
        if(Date.now() - data.ts > CACHE_TTL_MS) return null;
        return data;
    }catch(e){
        return null;
    }
}

function setCachedTokenData(symbol, data){
    try{
        localStorage.setItem(`cg_cache_${symbol}`, JSON.stringify({ ...data, ts: Date.now() }));
    }catch(e){ }
}

async function fetchCoinGeckoData(symbol){
    const cached = getCachedTokenData(symbol);
    if(cached) return cached;

    const searchRes = await fetch(`https://api.coingecko.com/api/v3/search?query=${encodeURIComponent(symbol)}`).then(r=>r.json());
    const coins = searchRes.coins || [];
    const match = coins.find(c => (c.symbol||'').toUpperCase() === symbol) || coins[0];
    if(!match) throw new Error(`CoinGecko no encontró ${symbol}`);

    const coinData = await fetch(`https://api.coingecko.com/api/v3/coins/${match.id}?localization=false&tickers=false&market_data=true&community_data=false&developer_data=false&sparkline=false`).then(r=>r.json());

    const supply = coinData.market_data?.circulating_supply || 0;
    const fdv = coinData.market_data?.fully_diluted_valuation?.usd || null;
    if(!supply) throw new Error(`CoinGecko no reporta circulating_supply para ${symbol}`);

    const data = { id: match.id, supply, fdv };
    setCachedTokenData(symbol, data);
    return data;
}

function computeMarketCap(symbol, price, tokenData){
    const marketCap = price * tokenData.supply;
    const umbral = CONFIG_UMBRALES[symbol] || tokenData.fdv || (marketCap * UMBRAL_FALLBACK_MULTIPLIER);
    const ratioBurbuja = marketCap / umbral;
    return { marketCap, umbral, ratioBurbuja };
}

/* ============================================================
   MÓDULO 2: ENERGÍA DE CHOQUE (ballena vs. resistencia)
   ============================================================ */
async function fetchShockEnergy(pair){
    const klines = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${pair}&interval=1m&limit=6`).then(r=>r.json());
    if(!Array.isArray(klines) || klines.length < 6) throw new Error('Velas 1m insuficientes.');

    const volumenesPrevios = klines.slice(0,5).map(k => +k[5]);
    const volumenPromedio5m = volumenesPrevios.reduce((a,b)=>a+b,0) / volumenesPrevios.length;
    const volumenActual = +klines[5][5];

    const precioHace5min = +klines[0][4];
    const precioActual = +klines[5][4];
    const variacionPrecio5m = ((precioActual - precioHace5min) / precioHace5min) * 100;
    const pendiente = (precioActual - precioHace5min) / 5;

    let estado = 'neutro';
    if(volumenActual > volumenPromedio5m*1.5 && Math.abs(variacionPrecio5m) < 0.2){
        estado = 'carga';
    }else if(variacionPrecio5m > 0.5 && volumenActual < volumenPromedio5m*0.8){
        estado = 'debilidad';
    }else if(volumenActual > volumenPromedio5m*2 && variacionPrecio5m > 1){
        estado = 'ruptura';
    }

    return { volumenPromedio5m, volumenActual, variacionPrecio5m, pendiente, estado, precioActual };
}

/* ============================================================
   MÓDULO SQUEEZE: RIESGO DE SQUEEZE (funding + OI + long/short)
   ============================================================ */
async function fetchSqueezeFuel(pair){
    const [premium, oiHist, klines] = await Promise.all([
        fetch(`https://fapi.binance.com/fapi/v1/premiumIndex?symbol=${pair}`).then(r=>r.json()),
        fetch(`https://fapi.binance.com/futures/data/openInterestHist?symbol=${pair}&period=5m&limit=13`).then(r=>r.json()),
        fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${pair}&interval=5m&limit=13`).then(r=>r.json())
    ]);

    const fundingPct = premium && premium.lastFundingRate !== undefined ? (+premium.lastFundingRate) * 100 : 0;

    let oiDeltaPct = 0;
    if(Array.isArray(oiHist) && oiHist.length >= 2){
        const oiStart = +oiHist[0].sumOpenInterest;
        const oiEnd = +oiHist[oiHist.length - 1].sumOpenInterest;
        oiDeltaPct = oiStart > 0 ? ((oiEnd - oiStart) / oiStart) * 100 : 0;
    }

    let priceChange1hPct = 0;
    if(Array.isArray(klines) && klines.length >= 2){
        const p0 = +klines[0][1];
        const p1 = +klines[klines.length-1][4];
        priceChange1hPct = p0 > 0 ? ((p1 - p0) / p0) * 100 : 0;
    }

    let shortPct = 50;
    try{
        const lsRatio = await fetch(`https://fapi.binance.com/futures/data/globalLongShortAccountRatio?symbol=${pair}&period=5m&limit=1`).then(r=>r.json());
        if(Array.isArray(lsRatio) && lsRatio[0] && lsRatio[0].shortAccount){
            shortPct = (+lsRatio[0].shortAccount) * 100;
        }
    }catch(e){ }

    return { fundingPct, oiDeltaPct, shortPct, priceChange1hPct };
}

function computeSqueezeScore({ fundingPct, oiDeltaPct, shortPct }, priceChange1hPct){
    let score = 50;
    score += Math.max(-18, Math.min(18, -fundingPct * 25));
    if(priceChange1hPct > 0){
        score += Math.max(-16, Math.min(16, oiDeltaPct * 1.1));
    }else{
        score -= Math.max(-16, Math.min(16, oiDeltaPct * 1.1)) * 0.5;
    }
    score += (shortPct - 50) * 0.7;
    return Math.max(0, Math.min(100, score));
}

/* Cuadrante Δ OI (1h) x Δ precio (1h). Devuelve además una key corta
   para que el veredicto global la use sin re-parsear el texto. */
function classifyFuelState(oiDeltaPct, priceChangePct){
    const OI_DEADZONE = 1.0;
    if(Math.abs(oiDeltaPct) < OI_DEADZONE){
        return { key:'sin-cambios', label: '➖ SIN CAMBIOS CLAROS DE OI', color: 'var(--text-faint)' };
    }
    if(priceChangePct > 0){
        if(oiDeltaPct < 0) return { key:'quemandose', label: '🔥 COMBUSTIBLE QUEMÁNDOSE · shorts cubriendo', color: 'var(--safe)' };
        return { key:'fresco', label: '⛽ COMBUSTIBLE FRESCO · entra plata nueva', color: 'var(--danger)' };
    }else{
        if(oiDeltaPct > 0) return { key:'shorts-nuevos', label: '🆕 SHORTS NUEVOS ENTRANDO', color: 'var(--gold)' };
        return { key:'deleverage', label: '🧊 DELEVERAGE · cerrando posiciones', color: 'var(--text-dim)' };
    }
}

/* ============================================================
   MÓDULOS PRE-RUPTURA
   ============================================================ */
function classifyWallState(consumptionPct, cvdDelta){
    if(consumptionPct > 15 && cvdDelta > 0){
        return { label:'CONSUMO REAL · COMPRA AGRESIVA', cls:'consumo-real', color:'#ff9900' };
    }
    if(consumptionPct > 15 && cvdDelta <= 0){
        return { label:'RETIRO DE ORDEN (FAKE WALL)', cls:'retiro', color:'var(--text-dim)' };
    }
    if(consumptionPct < -5){
        return { label:'PARED REFORZÁNDOSE', cls:'reforzando', color:'var(--safe)' };
    }
    return { label:'PARED ESTABLE', cls:'estable', color:'var(--text-faint)' };
}

async function pollPreRuptura(pair){
    if(!wallWatch) return;
    const consumoValue = document.getElementById('consumoValue');
    const consumoBarFill = document.getElementById('consumoBarFill');
    const consumoSub = document.getElementById('consumoSub');
    const cvdValue = document.getElementById('cvdValue');
    const cvdBarFill = document.getElementById('cvdBarFill');
    const cvdSub = document.getElementById('cvdSub');
    const tensionValue = document.getElementById('tensionValue');
    const terminal = document.querySelector('.terminal');
    if(!consumoValue || !cvdValue || !tensionValue) return;

    try{
        const now = Date.now();
        const [dep, bt] = await Promise.all([
            fetch(`https://fapi.binance.com/fapi/v1/depth?symbol=${pair}&limit=1000`).then(r=>r.json()),
            fetch(`https://fapi.binance.com/fapi/v1/ticker/price?symbol=${pair}`).then(r=>r.json())
        ]);

        const currentPrice = +bt.price;
        const asksInBucket = dep.asks
            .map(a => ({ p:+a[0], u:+a[0]*+a[1] }))
            .filter(a => a.p >= wallWatch.priceLow && a.p < wallWatch.priceHigh);
        const currUsd = asksInBucket.reduce((s,a) => s+a.u, 0);
        const prevUsd = wallWatch.lastUsd;
        const consumptionPct = prevUsd > 0 ? ((prevUsd - currUsd) / prevUsd) * 100 : 0;

        let buyVol = 0, sellVol = 0;
        try{
            const trades = await fetch(`https://fapi.binance.com/fapi/v1/aggTrades?symbol=${pair}&startTime=${wallWatch.lastTradeTime}&endTime=${now}&limit=1000`).then(r=>r.json());
            if(Array.isArray(trades)){
                trades.forEach(t => {
                    const p = +t.p, q = +t.p * +t.q;
                    if(p >= wallWatch.priceLow && p < wallWatch.priceHigh){
                        if(t.m === false) buyVol += q; else sellVol += q;
                    }
                });
            }
        }catch(e){ }

        const cvdDelta = buyVol - sellVol;
        const totalVol = buyVol + sellVol;

        const stateInfo = classifyWallState(consumptionPct, cvdDelta);
        consumoValue.style.color = stateInfo.color;
        consumoValue.textContent = `${stateInfo.label} (${consumptionPct >= 0 ? '-' : '+'}${Math.abs(consumptionPct).toFixed(1)}%)`;
        consumoBarFill.className = `energy-bar-fill ${stateInfo.cls}`;
        consumoBarFill.style.width = `${Math.max(Math.min(Math.abs(consumptionPct)*4, 100), 4)}%`;
        consumoSub.textContent = `Pared: $${formatCompact(prevUsd)} → $${formatCompact(currUsd)}  (T-1 vs T0, cada ${POLL_MS/1000}s)`;
        lecturas.consumo = stateInfo.cls;

        if(totalVol > 0){
            const buyPct = (buyVol/totalVol)*100;
            cvdValue.style.color = cvdDelta > 0 ? 'var(--safe)' : 'var(--danger)';
            cvdValue.textContent = `${cvdDelta > 0 ? '▲' : '▼'} $${formatCompact(Math.abs(cvdDelta))}`;
            cvdBarFill.className = `energy-bar-fill ${cvdDelta > 0 ? 'cvd-buy' : 'cvd-sell'}`;
            cvdBarFill.style.width = `${Math.max(buyPct,4)}%`;
            cvdSub.textContent = `Market Buy $${formatCompact(buyVol)} · Market Sell $${formatCompact(sellVol)} dentro de la pared`;
            lecturas.cvd = cvdDelta > 0 ? 'compra' : 'venta';
        }else{
            cvdValue.style.color = 'var(--text-faint)';
            cvdValue.textContent = 'Sin trades en la zona';
            cvdBarFill.className = 'energy-bar-fill';
            cvdBarFill.style.width = '0%';
            cvdSub.textContent = 'No hubo ejecuciones dentro del rango de precio de la pared en este intervalo.';
            lecturas.cvd = 'sin-datos';
        }

        const distPct = ((wallWatch.priceLow - currentPrice) / currentPrice) * 100;
        const enTension = distPct >= 0 && distPct < TENSION_THRESHOLD_PCT;
        tensionValue.textContent = `${distPct.toFixed(3)}%${enTension ? '  ⚠ CRÍTICA' : ''}`;
        tensionValue.classList.toggle('critica', enTension);
        tensionValue.style.color = enTension ? '#ff9900' : (distPct < 0 ? 'var(--danger)' : 'var(--text)');
        terminal.classList.toggle('tension-critica', enTension);

        wallWatch.lastUsd = currUsd;
        wallWatch.lastTradeTime = now;

        renderVeredicto();
    }catch(err){
        if(consumoSub) consumoSub.textContent = `⚠ Error de sondeo: ${err.message}`;
    }
}

/* ============================================================
   VEREDICTO GLOBAL — traduce todas las lecturas a un titular
   único en lenguaje simple, con un puntaje de confianza.
   ============================================================
   Puntaje: cada señal suma o resta puntos a un eje -100 (VENTA
   fuerte) .. +100 (COMPRA fuerte). No es una señal de trading,
   es solo una forma más fácil de leer lo que ya calculan los
   módulos de arriba.
*/
function renderVeredicto(){
    const box = document.getElementById('veredictoBox');
    if(!box) return;

    const headline = document.getElementById('veredictoHeadline');
    const sub = document.getElementById('veredictoSub');
    const chips = document.getElementById('veredictoChips');
    const fill = document.getElementById('confianzaFill');
    const labelIzq = document.getElementById('confianzaLabelIzq');
    const labelDer = document.getElementById('confianzaLabelDer');

    let puntos = 0;
    let señalesActivas = 0;
    const explicaciones = [];

    // Energía de choque
    if(lecturas.energia === 'carga'){ puntos += 25; señalesActivas++; explicaciones.push({t:'Ballena absorbiendo la pared', c:'var(--blue-neon)'}); }
    else if(lecturas.energia === 'debilidad'){ puntos -= 20; señalesActivas++; explicaciones.push({t:'Subida sin volumen real', c:'var(--gold)'}); }
    else if(lecturas.energia === 'ruptura'){ puntos += 30; señalesActivas++; explicaciones.push({t:'Pared rota con volumen', c:'var(--danger)'}); }

    // Consumo de pared
    if(lecturas.consumo === 'consumo-real'){ puntos += 25; señalesActivas++; explicaciones.push({t:'Pared siendo comida en serio', c:'#ff9900'}); }
    else if(lecturas.consumo === 'retiro'){ puntos -= 10; señalesActivas++; explicaciones.push({t:'Pared cancelada, no comprada', c:'var(--text-dim)'}); }
    else if(lecturas.consumo === 'reforzando'){ puntos -= 15; señalesActivas++; explicaciones.push({t:'Vendedor reforzando la pared', c:'var(--safe)'}); }

    // CVD en la pared
    if(lecturas.cvd === 'compra'){ puntos += 20; señalesActivas++; explicaciones.push({t:'Compra agresiva contra la pared', c:'var(--safe)'}); }
    else if(lecturas.cvd === 'venta'){ puntos -= 20; señalesActivas++; explicaciones.push({t:'Venta agresiva en la zona', c:'var(--danger)'}); }

    // Combustible de squeeze
    if(lecturas.squeezeFuel === 'fresco'){ puntos -= 15; señalesActivas++; explicaciones.push({t:'Entra plata nueva a favor de la suba', c:'var(--danger)'}); }
    else if(lecturas.squeezeFuel === 'quemandose'){ puntos += 15; señalesActivas++; explicaciones.push({t:'Shorts cubriéndose, combustible gastado', c:'var(--safe)'}); }
    else if(lecturas.squeezeFuel === 'shorts-nuevos'){ puntos += 10; señalesActivas++; explicaciones.push({t:'Shorts nuevos entrando de verdad', c:'var(--gold)'}); }
    else if(lecturas.squeezeFuel === 'deleverage'){ puntos -= 5; señalesActivas++; explicaciones.push({t:'Cierre de posiciones, no venta nueva', c:'var(--text-dim)'}); }

    if(señalesActivas === 0){
        headline.textContent = 'ESPERANDO DATOS…';
        headline.style.color = 'var(--text-faint)';
        sub.textContent = 'Todavía no hay suficientes lecturas para armar un veredicto.';
        chips.innerHTML = '';
        fill.style.width = '0%';
        fill.style.background = 'var(--text-faint)';
        labelIzq.textContent = 'VENTA';
        labelDer.textContent = 'COMPRA';
        return;
    }

    let titulo, color, texto;
    if(puntos >= 30){
        titulo = '🟢 PRESIÓN COMPRADORA REAL';
        color = 'var(--safe)';
        texto = 'Las señales apuntan a que hay compra genuina sosteniendo el precio, no solo mecha.';
    }else if(puntos >= 10){
        titulo = '🟡 SESGO A COMPRA, SIN CONFIRMAR';
        color = 'var(--gold)';
        texto = 'Hay algo de presión compradora, pero todavía falta que más señales coincidan.';
    }else if(puntos > -10){
        titulo = '⚪ SIN SESGO CLARO';
        color = 'var(--text-dim)';
        texto = 'Las señales están mezcladas o son insuficientes. No hay una lectura dominante todavía.';
    }else if(puntos > -30){
        titulo = '🟡 SESGO A VENTA, SIN CONFIRMAR';
        color = 'var(--gold)';
        texto = 'Hay indicios de debilidad o venta, pero todavía no está confirmado por todas las señales.';
    }else{
        titulo = '🔴 PRESIÓN VENDEDORA REAL';
        color = 'var(--danger)';
        texto = 'Varias señales coinciden en que la subida fue débil o está siendo vendida activamente.';
    }

    headline.textContent = titulo;
    headline.style.color = color;
    sub.textContent = texto;

    chips.innerHTML = explicaciones.map(e => `<span class="chip" style="color:${e.c};border-color:${e.c}">${e.t}</span>`).join('');

    const pctFill = Math.min(Math.abs(puntos), 100);
    fill.style.width = `${Math.max(pctFill, 3)}%`;
    fill.style.background = color;
    fill.style.marginLeft = puntos < 0 ? 'auto' : '0';
    labelIzq.textContent = 'VENTA';
    labelDer.textContent = 'COMPRA';
}

            <div class="chart-wrap">
                <div class="lightning-icon" id="lightningIcon">⚡</div>
                <div class="wall-tag" style="left:${tagPct}%;">$${fmtPrice(top.usd)}</div>
                <div class="gridlines"><div></div><div></div><div></div><div></div></div>
                <div class="wallbar">${walls.map((w,i) => `<div class="wcol ${i===topIndex?'top':''}" style="height:${Math.max((w.usd/maxUsd)*76,2)}px"></div>`).join('')}</div>
                <div class="axis"><span>${fmtPrice(price)}</span><span>${fmtPrice(price*(1+RNG_PCT))}</span></div>
            </div>

            <div class="metric-row">
                <div class="metric-head">
                    <div class="metric-label-wrap">
                        <span class="metric-label">RESISTENCIA</span>
                        <span class="info-icon">i</span>
                        <div class="tooltip">
                            <b>¿Qué mide?</b><br>
                            Suma la liquidez de venta (asks) en el 15% de rango sobre el precio y la compara contra el volumen operado en 24h.<br><br>
                            <b>Cómo leerlo:</b> % más alto = más liquidez esperando vs. lo que se mueve en un día → cuesta más romper esa zona. % más bajo = pared más débil, el volumen normal podría barrerla.<br><br>
                            Es una heurística propia del script, no un indicador técnico estándar. La flecha compara contra tu última corrida en esta sesión.
                        </div>
                    </div>
                    <span class="metric-value" style="color:${resColor}">${trendUp ? '▲' : '▼'} ${res.toFixed(2)}%</span>
                </div>
                <div class="gauge">${Array.from({length:10}, (_,i)=>`<div style="background:${i<gaugeFilled?resColor:'var(--line-soft)'}"></div>`).join('')}</div>
            </div>

            <div class="metric-row" id="mcapRow">
                <div class="metric-head">
                    <div class="metric-label-wrap">
                        <span class="metric-label">MARKET CAP · RATIO BURBUJA</span>
                        <span class="info-icon">i</span>
                        <div class="tooltip">
                            <b>¿Qué mide?</b><br>
                            Market Cap = Precio actual × Suministro circulante real (CoinGecko, cacheado 60 min).<br><br>
                            Ratio Burbuja = Market Cap ÷ Umbral Máximo Lógico definido para este token.<br><br>
                            Ratio > 1.0 → el mercado ya paga por encima del techo lógico configurado: zona de riesgo matemático (panel se pone rojo).
                        </div>
                    </div>
                    <span class="metric-value" id="mcapValue">--</span>
                </div>
                <div class="gauge" id="mcapGauge">${Array.from({length:10}, ()=>'<div></div>').join('')}</div>
                <div class="mcap-sub" id="mcapSub">Consultando CoinGecko…</div>
            </div>

            <div class="metric-row" id="energyRow">
                <div class="metric-head">
                    <div class="metric-label-wrap">
                        <span class="metric-label">ENERGÍA DE CHOQUE</span>
                        <span class="info-icon">i</span>
                        <div class="tooltip">
                            <b>¿Qué mide?</b><br>
                            Compara el volumen del último minuto contra el promedio de los 5 minutos previos, cruzado con la variación de precio.<br><br>
                            <b>Azul (Carga):</b> volumen alto, precio casi plano → ballena absorbiendo la pared.<br>
                            <b>Amarillo (Debilidad):</b> precio sube pero sin volumen real → subida falsa.<br>
                            <b>Rojo (Ruptura):</b> volumen y precio disparados juntos → pared rota / short liquidado.
                        </div>
                    </div>
                    <span class="metric-value" id="energyValue">--</span>
                </div>
                <div class="energy-bar-wrap"><div class="energy-bar-fill" id="energyBarFill"></div></div>
            </div>

            <div class="metric-row" id="consumoRow">
                <div class="metric-head">
                    <div class="metric-label-wrap">
                        <span class="metric-label">CONSUMO DE PARED (T0 vs T-1)</span>
                        <span class="info-icon">i</span>
                        <div class="tooltip">
                            <b>¿Qué mide?</b><br>
                            Compara el volumen USD de la pared vigilada entre este sondeo y el anterior (cada ${POLL_MS/1000}s).<br><br>
                            Si baja Y hay Market Buy agresivo real dentro de esa zona (ver CVD abajo) → <b>Consumo Real</b>, ruptura probable.<br><br>
                            Si baja pero el CVD no lo respalda → probablemente fue una <b>orden cancelada</b> (fake wall), no una ruptura.
                        </div>
                    </div>
                    <span class="metric-value" id="consumoValue">--</span>
                </div>
                <div class="energy-bar-wrap"><div class="energy-bar-fill" id="consumoBarFill"></div></div>
                <div class="mcap-sub" id="consumoSub">Esperando primer sondeo…</div>
            </div>

            <div class="metric-row" id="cvdRow">
                <div class="metric-head">
                    <div class="metric-label-wrap">
                        <span class="metric-label">CVD ESTIMADO EN LA PARED</span>
                        <span class="info-icon">i</span>
                        <div class="tooltip">
                            <b>¿Qué mide?</b><br>
                            Delta de volumen agresivo (Market Buy − Market Sell) ejecutado dentro del rango de precio de la pared vigilada, desde el último sondeo.<br><br>
                            Verde = predominan compras agresivas contra la pared (presión de ruptura). Rojo = predominan ventas o no hay agresión compradora real.
                        </div>
                    </div>
                    <span class="metric-value" id="cvdValue">--</span>
                </div>
                <div class="energy-bar-wrap"><div class="energy-bar-fill" id="cvdBarFill"></div></div>
                <div class="mcap-sub" id="cvdSub">Esperando primer sondeo…</div>
            </div>

            <div class="metric-row" id="tensionRow">
                <div class="metric-head">
                    <div class="metric-label-wrap">
                        <span class="metric-label">TENSIÓN · DISTANCIA A LA PARED</span>
                        <span class="info-icon">i</span>
                        <div class="tooltip">
                            <b>¿Qué mide?</b><br>
                            Distancia porcentual entre el precio actual y el precio de la pared vigilada.<br><br>
                            Por debajo del ${TENSION_THRESHOLD_PCT}% el panel entero parpadea en naranja — la ruptura puede ocurrir en cualquier momento.
                        </div>
                    </div>
                    <span class="metric-value" id="tensionValue">--</span>
                </div>
            </div>

            <div class="divider"></div>

            <div class="metric-row" id="squeezeRow">
                <div class="metric-head">
                    <div class="metric-label-wrap">
                        <span class="metric-label">RIESGO DE SQUEEZE</span>
                        <span class="info-icon">i</span>
                        <div class="tooltip">
                            <b>¿Qué mide?</b><br>
                            Combina Funding Rate + delta de Open Interest (1h) + Ratio Long/Short de cuentas, todo público de Binance Futures.<br><br>
                            <b>Alto (rojo):</b> funding negativo fuerte y/o muchos shorts acumulados → todavía queda combustible para que la suba continúe. Esperar antes de entrar corto.<br><br>
                            <b>Bajo (verde):</b> shorts ya se cubrieron (OI cayendo con precio subiendo) y/o funding neutral/positivo → el combustible del squeeze ya se quemó, momento más seguro para evaluar un corto.<br><br>
                            Δ OI y Δ precio se calculan sobre la misma ventana de 1h, para que sean comparables entre sí. La etiqueta debajo de las 3 casillas traduce ese cruce a lenguaje simple (🔥 quemándose, ⛽ fresco, 🆕 shorts nuevos, 🧊 deleverage).<br><br>
                            Es una heurística propia, no un indicador estándar ni garantía de nada — el precio puede seguir moviéndose igual.
                        </div>
                    </div>
                    <span class="squeeze-badge" id="squeezeBadge">--</span>
                </div>
                <div class="squeeze-gauge-wrap">
                    <div class="squeeze-gauge-track"><div class="squeeze-gauge-fill" id="squeezeGaugeFill" style="width:0%"></div></div>
                    <span class="metric-value" id="squeezeScoreLabel" style="font-size:13px;">--</span>
                </div>
                <div class="squeeze-sub-grid">
                    <div class="squeeze-stat">
                        <div class="squeeze-stat-label">FUNDING</div>
                        <div class="squeeze-stat-value" id="squeezeFunding">--</div>
                    </div>
                    <div class="squeeze-stat">
                        <div class="squeeze-stat-label">Δ OI (1H)</div>
                        <div class="squeeze-stat-value" id="squeezeOi">--</div>
                    </div>
                    <div class="squeeze-stat">
                        <div class="squeeze-stat-label">% CUENTAS SHORT</div>
                        <div class="squeeze-stat-value" id="squeezeShortPct">--</div>
                    </div>
                </div>
                <div class="squeeze-fuel-tag" id="squeezeFuelTag">Calculando…</div>
                <div class="squeeze-disclaimer">⚠ Heurística propia basada en datos públicos de Binance Futures. No es asesoramiento financiero ni un indicador de precisión garantizada.</div>
            </div>
        `;
        prevRes = res;
        statusDot.className = 'status-dot on';
        statusText.textContent = 'LIVE';

        out.querySelectorAll('.info-icon').forEach(icon => {
            icon.addEventListener('click', (e) => {
                e.stopPropagation();
                icon.classList.toggle('active');
            });
        });

        renderVeredicto();

        updateRiskModules(raw, pair, price);

        pollTimer = setInterval(() => pollPreRuptura(pair), POLL_MS);
        pollPreRuptura(pair);

        updateSqueezeModule(pair, price);
        squeezeTimer = setInterval(() => updateSqueezeModule(pair, price), SQUEEZE_POLL_MS);
    }catch(err){
        out.innerHTML = `<div class="divider"></div><div class="err">⚠ ${err.message || 'Error al consultar Binance. Verifica el símbolo.'}</div>`;
        statusDot.className = 'status-dot';
        statusText.textContent = 'ERROR';
        terminal.classList.remove('zona-peligro','modo-vertical','tension-critica');
        if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
        if(squeezeTimer){ clearInterval(squeezeTimer); squeezeTimer = null; }
        wallWatch = null;
    }
}

document.addEventListener('click', () => {
    document.querySelectorAll('.info-icon.active').forEach(i => i.classList.remove('active'));
});

document.getElementById('btn').onclick = run;
document.getElementById('sym').addEventListener('keydown', e => { if(e.key === 'Enter') run(); });
</script>
</body>
</html>
